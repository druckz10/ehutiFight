<script>
    // Initialize Debug Log
    (function () {
        const checkLog = setInterval(() => {
            const content = document.getElementById('debug-content');
            if (content) {
                clearInterval(checkLog);
                const log = (msg, type) => {
                    const div = document.createElement('div');
                    div.style.color = type === 'error' ? '#ff4444' : '#0f0';
                    div.style.marginBottom = '4px';
                    div.textContent = `[${new Date().toLocaleTimeString()}] ${msg}`;
                    content.appendChild(div);
                };
                const originalLog = console.log;
                const originalError = console.error;
                console.log = function () { originalLog.apply(console, arguments); log(Array.from(arguments).join(' '), 'log'); };
                console.error = function () { originalError.apply(console, arguments); log(Array.from(arguments).join(' '), 'error'); };
                console.log("Debug system ready (v2.2.3)");
            }
        }, 100);
    })();

    // Global Touch State
    window.touchState = {
        up: false,
        down: false,
        left: false,
        right: false,
        attack1: false,
        attack2: false
    };

    const bindBtn = (id, key) => {
        const btn = document.getElementById(id);
        const start = (e) => {
            e.preventDefault();
            window.touchState[key] = true;
        };
        const end = (e) => {
            e.preventDefault();
            window.touchState[key] = false;
        };

        btn.addEventListener('touchstart', start, {
            passive: false
        });
        btn.addEventListener('touchend', end, {
            passive: false
        });
        btn.addEventListener('mousedown', start); // For testing on PC
        btn.addEventListener('mouseup', end);
    };

    // Native Login UI Controls
    window.showLoginUI = (visible) => {
        const overlay = document.getElementById('login-overlay');
        if (overlay) overlay.style.display = visible ? 'flex' : 'none';
    };

    window.setLoginStatus = (msg, color) => {
        const status = document.getElementById('status-msg');
        if (status) {
            status.textContent = msg;
            status.style.color = color;
        }
    };

    // Global visibility toggle
    window.setMobileControlsVisible = (visible) => {
        const controls = document.getElementById('touch-controls');
        if (!controls) return;

        // Only auto-show if on mobile/small screen OR forced by URL
        const isMobile = (window.matchMedia("(hover: none) and (pointer: coarse)").matches) ||
            (window.innerWidth <= 900) ||
            (window.location.search.includes('mobile'));

        if (visible && isMobile) {
            controls.style.display = 'block';
        } else {
            controls.style.display = 'none';
        }
    };

    window.addEventListener('load', () => {
        bindBtn('dpad-left', 'left');
        bindBtn('dpad-right', 'right');
        bindBtn('dpad-up', 'up');
        bindBtn('dpad-down', 'down');
        bindBtn('btn-jab', 'attack1');
        bindBtn('btn-kick', 'attack2');

        // Initial state is hidden (unless forced debug)
        if (window.location.search.includes('mobile_force')) {
            document.getElementById('touch-controls').style.display = 'block';
        }
    });

    // --- CACHE KILL SWITCH (Force Refresh for v2.2.0) ---
    const EXPECTED_VERSION = '2.2.3';
    if (localStorage.getItem('app_v') !== EXPECTED_VERSION) {
        localStorage.setItem('app_v', EXPECTED_VERSION);
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.getRegistrations().then(regs => {
                for (let reg of regs) reg.unregister();
                window.location.reload();
            });
        }
    }

    // PWA Reg (Force Update)
    if ('serviceWorker' in navigator) {
        navigator.serviceWorker.register('sw.js?v=2.2.3', { updateViaCache: 'none' })
            .then(reg => {
                reg.update();
            });

        let refreshing = false;
        navigator.serviceWorker.addEventListener('controllerchange', () => {
            if (!refreshing) {
                window.location.reload();
                refreshing = true;
            }
        });
    }
</script>
